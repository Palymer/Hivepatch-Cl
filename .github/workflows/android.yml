name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: libv2ray-v26.7.28

      - name: Decode release keystore
        env:
          B64: ${{ secrets.HIVEPATCH_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "HIVEPATCH_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        env:
          HIVEPATCH_RELEASE_STORE_PASSWORD: ${{ secrets.HIVEPATCH_RELEASE_STORE_PASSWORD }}
          HIVEPATCH_RELEASE_KEY_ALIAS: ${{ secrets.HIVEPATCH_RELEASE_KEY_ALIAS }}
          HIVEPATCH_RELEASE_KEY_PASSWORD: ${{ secrets.HIVEPATCH_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Stage APKs
        run: |
          mkdir -p dist
          short="${GITHUB_SHA::7}"
          shopt -s nullglob
          for apk in app/build/outputs/apk/debug/*.apk; do
            cp "$apk" "dist/HivePatch-${short}-debug.apk"
          done
          for apk in app/build/outputs/apk/release/*.apk; do
            name="$(basename "$apk")"
            if [[ "$name" == *unsigned* ]]; then
              cp "$apk" "dist/HivePatch-${short}-release-unsigned.apk"
            else
              cp "$apk" "dist/HivePatch-${short}-release.apk"
            fi
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: hivepatch-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: false
          files: dist/*.apk
          body: |
            Automatic build from `${{ github.sha }}` on `main`.
            Debug APK is signed with the Android debug key and can be installed.

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
